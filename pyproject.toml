[project]
name = "adb-tap"
dynamic = ["version"]
description = "Android 手机极速点击工具，支持 NTP 校时定时触发与预设坐标管理"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ntplib>=0.4.0",
]

[project.scripts]
adb-tap = "adb_tap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_tap"]

[tool.hatch.version]
path = "src/adb_tap/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
